version: "2"
sql:
  - engine: "mysql"
    schema: "graph/connect/data/schema.sql"
    queries: "queries/sql/"
    gen:
      go:
        package: "generated"
        out: "queries/generated"
        emit_interface: true
        overrides:
          - column: "users.creation_date"
            go_type:
              import: "workbench/graphql-app/graph/resolver/scalar"
              type: "Date"     

