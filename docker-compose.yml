services:
  graphql-go-app:
    container_name: GraphqlGoApp
    build:
      context: .
      dockerfile: Dockerfile
      args:
       - NODE_VERSION=20
       - GO_VERSION=1.25
       - ALPINE_BUILD_VERSION=3.20
    ports:
      - "6060:6060"
    environment:
      APP_ENV: prod
      PORT: 6060
      BADGER_PATH: /data/app.db
    volumes:
      - badger_data:/data

    restart: unless-stopped

volumes:
  badger_data:

